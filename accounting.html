<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BuildOps Accounting Integration Assistant</title>
  <link rel="stylesheet" href="accounting-style.css" />
</head>
<body>

  <div class="app">

    <!-- Header -->
    <header class="header">
      <span class="logo">BuildOps <span class="logo-sub">Accounting Assistant</span></span>
      <button class="settings-btn" id="settings-toggle" aria-label="Open settings" title="Settings">
        <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
          <path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.01 7.01 0 0 0-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54a7.33 7.33 0 0 0-1.62.94l-2.39-.96a.476.476 0 0 0-.59.22L2.74 8.87a.47.47 0 0 0 .12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54a7.33 7.33 0 0 0 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.47.47 0 0 0-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
        </svg>
      </button>
    </header>

    <!-- Settings Panel -->
    <div class="settings-panel" id="settings-panel" hidden>
      <div class="settings-inner">
        <h3>Settings</h3>
        <label>
          Your BuildOps Email
          <input type="email" id="glean-email" placeholder="you@buildops.com" autocomplete="off" />
          <small>Required by Glean server tokens (X-Glean-ActAs)</small>
        </label>
        <label>
          Glean API Token
          <input type="password" id="glean-token" placeholder="Paste your Glean API token" autocomplete="off" />
          <small>Server token issued by your IT / Glean admin</small>
        </label>
        <label>
          Glean Backend URL
          <input type="text" id="glean-backend" placeholder="buildops-be.glean.com" />
          <small>Typically &lt;company&gt;-be.glean.com</small>
        </label>
        <div class="settings-actions">
          <button id="save-settings">Save Settings</button>
          <span id="settings-status" class="settings-status"></span>
        </div>
      </div>
    </div>

    <!-- Main -->
    <main class="main">

      <div class="hero">
        <h1 class="headline">Accounting Integration Help</h1>
        <p class="subheadline">Select your accounting system, choose the topics you need help with, and get answers pulled straight from BuildOps documentation.</p>
      </div>

      <!-- Prompt Card -->
      <div class="prompt-card" id="prompt-card">

        <!-- ERP Dropdown (only ERPs currently connected to BuildOps) -->
        <div class="field-group">
          <label for="erp-select">Accounting System</label>
          <div class="select-wrapper">
            <select id="erp-select">
              <option value="">— Select an ERP —</option>
              <optgroup label="Cloud">
                <option value="QuickBooks Online">QuickBooks Online</option>
                <option value="Sage Intacct">Sage Intacct</option>
                <option value="NetSuite (Oracle)">NetSuite (Oracle)</option>
              </optgroup>
              <optgroup label="Desktop / On-Premise">
                <option value="QuickBooks Desktop (Enterprise)">QuickBooks Desktop (Enterprise)</option>
                <option value="Sage 300 CRE (Timberline)">Sage 300 CRE (Timberline)</option>
                <option value="Foundation Software">Foundation Software</option>
                <option value="Spectrum (Viewpoint)">Spectrum (Viewpoint)</option>
              </optgroup>
            </select>
            <svg class="select-arrow" viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
              <path d="M7 10l5 5 5-5z"/>
            </svg>
          </div>
          <p class="erp-description" id="erp-description"></p>
        </div>

        <!-- Topic multi-select -->
        <div class="field-group" id="topics-group" hidden>
          <label>What do you need help with? <span class="label-hint">(select all that apply)</span></label>
          <div class="topic-toggles" id="topic-toggles">
            <button class="topic-toggle" data-topic="general" aria-pressed="false">
              <span class="toggle-icon">
                <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
              </span>
              General Knowledge
            </button>
            <button class="topic-toggle" data-topic="paths" aria-pressed="false">
              <span class="toggle-icon">
                <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M9.5 6.5v3h-3v-3h3M11 5H5v6h6V5zm-1.5 9.5v3h-3v-3h3M11 13H5v6h6v-6zm6.5-6.5v3h-3v-3h3M19 5h-6v6h6V5zm-6 8h1.5v1.5H13V13zm1.5 1.5H16V16h-1.5v-1.5zM16 13h1.5v1.5H16V13zm-3 3h1.5v1.5H13V16zm1.5 1.5H16V19h-1.5v-1.5zM16 16h1.5v1.5H16V16zm1.5-1.5H19V16h-1.5v-1.5zm0 3H19V19h-1.5v-1.5zM22 7h-2V4h-3V2h5v5zm0 15v-5h-2v3h-3v2h5zM2 22h5v-2H4v-3H2v5zM2 2v5h2V4h3V2H2z"/></svg>
              </span>
              Integration Paths
            </button>
            <button class="topic-toggle" data-topic="installation" aria-pressed="false">
              <span class="toggle-icon">
                <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M19.43 12.98c.04-.32.07-.64.07-.98 0-.34-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98 0 .33.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zm-7.43 2.52c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/></svg>
              </span>
              Installation Tips
            </button>
            <button class="topic-toggle" data-topic="setup" aria-pressed="false">
              <span class="toggle-icon">
                <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
              </span>
              Basic Setup
            </button>
            <button class="topic-toggle" data-topic="troubleshoot" aria-pressed="false">
              <span class="toggle-icon">
                <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
              </span>
              Troubleshooting
            </button>
            <button class="topic-toggle" data-topic="sync-errors" aria-pressed="false">
              <span class="toggle-icon">
                <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
              </span>
              Sync Errors
            </button>
          </div>
        </div>

        <!-- Optional extra question -->
        <div class="field-group" id="question-group" hidden>
          <label for="question-input">Additional Details <span class="label-hint">(optional)</span></label>
          <textarea
            id="question-input"
            placeholder="e.g. 'We use phases and departments in Sage 300 — can BuildOps accommodate that?' or a specific error message you're seeing."
            rows="3"
          ></textarea>
        </div>

        <!-- Submit -->
        <button class="ask-btn" id="ask-btn" disabled>
          <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
          Ask
        </button>

      </div>

      <!-- Thinking indicator -->
      <div class="thinking-area" id="thinking-area" hidden>
        <div class="thinking-dots">
          <span></span><span></span><span></span>
        </div>
        <p class="thinking-text">Looking up integration details…</p>
      </div>

      <!-- Response Area -->
      <div class="response-area" id="response-area" hidden>
        <div class="response-header">
          <span class="area-label">BuildOps AI</span>
          <button class="new-question-btn" id="new-question-btn">New question</button>
        </div>
        <div class="response-text" id="response-text"></div>
        <div class="follow-ups" id="follow-ups" hidden>
          <div class="area-label follow-up-label">Suggested follow-ups</div>
          <ul class="follow-up-list" id="follow-up-list"></ul>
        </div>
      </div>

      <!-- Error Area -->
      <div class="error-area" id="error-area" hidden></div>

    </main>
  </div>

  <script src="accounting.js"></script>
</body>
</html>
